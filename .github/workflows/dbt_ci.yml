name: dbt CI/CD

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  run-dbt:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dbt
        run: |
          pip install dbt-snowflake==1.10.2

      - name: Setup dbt profile
        run: |
          mkdir -p ~/.dbt
          echo "${{ secrets.DBT_PROFILES_YML }}" > ~/.dbt/profiles.yml

      - name: Debug dbt
        run: dbt debug

      - name: Run models
        run: dbt run --target dev

      - name: Run tests
        run: dbt test --target dev